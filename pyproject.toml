[project]
name = "siftasr"
version = "0.1.0"
description = "Language-routed speech-to-text (en/vi/zh/whisper) and ElevenLabs-style speaker attribution for local Apple Silicon, CUDA, and CPU."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "faster-whisper>=1.0",
    "parakeet-mlx>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyobjc-framework-coreml>=12.2.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
zh = [
    "mlx-qwen3-asr>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
siftasr = "siftasr.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siftasr"]

[tool.pytest.ini_options]
pythonpath = ["tests", "src"]
